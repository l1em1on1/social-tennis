# Infrastructure commands, run from the repo root:
#
#   docker compose -f infra/compose.yml run --rm infra az login --use-device-code
#   docker compose -f infra/compose.yml run --rm infra sh ./init.sh
#   docker compose -f infra/compose.yml run --rm infra terraform plan
#
# Settings come from infra/.env, which scripts/setup-hosting.sh writes and git
# ignores. CI passes the same names as environment variables instead.
#
# The two API credentials are never in infra/.env (#113): they live only in
# the deploy environments' secrets. A local plan or apply takes them from your
# shell for that one command, typed without echo:
#
#   read -rs NEON_API_KEY && read -rs CLOUDFLARE_API_TOKEN && \
#     NEON_API_KEY="$NEON_API_KEY" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" \
#     docker compose -f infra/compose.yml run --rm infra terraform plan
services:
  infra:
    build: .
    working_dir: /infra
    volumes:
      - .:/infra
      # Keeps the `az login` session between runs.
      - azure_cli:/root/.azure
    env_file:
      - path: .env
        required: false
    # Passed through from the caller's environment when set there (CI does
    # this). Left unset otherwise, so the values in .env apply.
    environment:
      # Azure: which subscription, and (in CI) OIDC instead of an az login.
      - ARM_SUBSCRIPTION_ID
      - ARM_TENANT_ID
      - ARM_CLIENT_ID
      - ARM_USE_OIDC
      - ACTIONS_ID_TOKEN_REQUEST_URL
      - ACTIONS_ID_TOKEN_REQUEST_TOKEN
      # Where the Terraform state lives (read by init.sh).
      - TFSTATE_RESOURCE_GROUP
      - TFSTATE_STORAGE_ACCOUNT
      # Neon.
      - NEON_API_KEY
      - TF_VAR_neon_org_id
      # The club's domain, with its DNS in Cloudflare: sending email
      # (ADR-0020) and the app's address (ADR-0021).
      - CLOUDFLARE_API_TOKEN
      - TF_VAR_email_domain
      - TF_VAR_email_domain_verified
      - TF_VAR_app_domain
      - TF_VAR_app_domain_ready
      # Deployment inputs.
      - TF_VAR_alert_email
      - TF_VAR_admin_emails
      - TF_VAR_image_tag
      - TF_VAR_web_image_digest
      - TF_VAR_api_image_digest
      - TF_VAR_always_on
      - TF_VAR_long_cooldown

volumes:
  azure_cli:
