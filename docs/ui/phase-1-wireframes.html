<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Tennis Wireframes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;600&display=swap">
<!--
  Phase 1 wireframes (issue #41). A design document, not app code: open this
  file in a browser (double-click), pick a screen on the left, flip its states.
  Colours are the app's own tokens from web/src/app/globals.css (ADR-0014), so
  what you see here is what the real screens will use. Everything is in-memory
  and fake: no request leaves the page.
  Layout concept: a control rail beside one 360px phone; the phone holds the screen.
-->
<style>
:root {
  --bg: #f6f7f4; --surface: #ffffff; --surface-muted: #eceee8;
  --fg: #1a1d17; --fg-muted: #555c4f; --border: #d3d8cc;
  --accent: #2f6b1f; --accent-hover: #255617; --accent-fg: #ffffff; --accent-muted: #e2efdb;
  --success: #1d6a40; --success-muted: #dcf2e5;
  --warning: #835000; --warning-muted: #fbefd3;
  --danger: #b42318; --danger-muted: #fde7e4;
  --info: #1d4f91; --info-muted: #e1ebf8;
  /* Workbench chrome around the phone, deliberately not an app colour. */
  --desk: #e4e6df; --desk-fg: #2b2f27; --note: #fffbe8; --note-border: #e8dca4;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11140f; --surface: #1a1e17; --surface-muted: #262b22;
    --fg: #eef1ea; --fg-muted: #aab2a2; --border: #3a4233;
    --accent: #8fd16f; --accent-hover: #a6dd8b; --accent-fg: #10200a; --accent-muted: #22381a;
    --success: #7fd8a2; --success-muted: #153122;
    --warning: #f2bf62; --warning-muted: #36280c;
    --danger: #ff9385; --danger-muted: #3d1713;
    --info: #91bcff; --info-muted: #172a45;
    --desk: #0b0d0a; --desk-fg: #cfd5c8; --note: #2a2716; --note-border: #4a4426;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11140f; --surface: #1a1e17; --surface-muted: #262b22;
  --fg: #eef1ea; --fg-muted: #aab2a2; --border: #3a4233;
  --accent: #8fd16f; --accent-hover: #a6dd8b; --accent-fg: #10200a; --accent-muted: #22381a;
  --success: #7fd8a2; --success-muted: #153122;
  --warning: #f2bf62; --warning-muted: #36280c;
  --danger: #ff9385; --danger-muted: #3d1713;
  --info: #91bcff; --info-muted: #172a45;
  --desk: #0b0d0a; --desk-fg: #cfd5c8; --note: #2a2716; --note-border: #4a4426;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--desk); color: var(--desk-fg); font: 14px/1.45 var(--font-sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- workbench ---------- */
.bench { display: grid; grid-template-columns: minmax(0, 300px) 380px minmax(0, 320px); gap: 24px; justify-content: center; align-items: start; max-width: 1100px; margin: 0 auto; }
@media (max-width: 1080px) { .bench { grid-template-columns: minmax(0, 300px) 380px; } .notes { grid-column: 1 / -1; } }
@media (max-width: 720px) { .bench { grid-template-columns: minmax(0, 1fr); } .phone { margin: 0 auto; } }
.rail { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.rail h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.rail p { margin: 0; color: var(--desk-fg); opacity: .8; }
.rail h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; opacity: .75; }
.screens { display: flex; flex-direction: column; gap: 2px; }
.screens a { color: inherit; text-decoration: none; padding: 5px 8px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
.screens a:hover { background: color-mix(in srgb, var(--desk-fg) 8%, transparent); }
.screens a[aria-current="true"] { background: var(--desk-fg); color: var(--desk); font-weight: 600; }
.screens .num { font-family: var(--font-mono); font-size: 11px; opacity: .6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid color-mix(in srgb, var(--desk-fg) 30%, transparent); background: transparent; border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 12px; }
.chip[aria-pressed="true"] { background: var(--desk-fg); color: var(--desk); border-color: var(--desk-fg); }
.notes { background: var(--note); border: 1px solid var(--note-border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.notes h2 { font-size: 15px; margin: 0 0 6px; }
.notes h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 12px 0 4px; opacity: .75; }
.notes ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.notes .q li::marker { content: "? "; font-weight: 700; }

/* ---------- phone ---------- */
.phone { width: 380px; max-width: 100%; border-radius: 34px; padding: 10px; background: #1b1d19; box-shadow: 0 20px 50px -20px rgb(0 0 0 / .45); }
.screen { width: 360px; max-width: 100%; height: 780px; border-radius: 26px; overflow: hidden; background: var(--bg); color: var(--fg); position: relative; display: flex; flex-direction: column; font-size: 15px; }
.scroll { flex: 1; overflow-y: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 16px; }

/* app primitives, mirroring web/src/components/ui */
.hdr { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--border); min-height: 56px; }
.brand { font-weight: 700; }
.switcher { border: 0; background: transparent; text-align: right; line-height: 1.15; padding: 4px 6px; border-radius: 10px; cursor: pointer; min-height: 44px; }
.switcher small { display: block; color: var(--fg-muted); font-size: 11px; }
.switcher b { font-size: 14px; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); text-decoration: none; font-weight: 600; min-height: 44px; border: 0; background: none; padding: 0; cursor: pointer; }
.nav { display: flex; border-top: 1px solid var(--border); background: var(--surface); }
.nav a { flex: 1; min-height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--fg-muted); text-decoration: none; }
.nav a[aria-current="page"] { color: var(--accent); }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
h1.t { font-size: 24px; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--fg-muted); margin: -10px 0 0; font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card > h2 { font-size: 16px; margin: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card.hl { border-color: var(--warning); box-shadow: inset 4px 0 0 var(--warning); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.muted { color: var(--fg-muted); }
.small { font-size: 13px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid transparent; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center; }
.btn.full { width: 100%; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); }
.btn.secondary { background: var(--surface); border-color: var(--border); color: var(--fg); }
.btn.ghost { background: transparent; color: var(--fg); }
.btn.danger { background: var(--danger); color: var(--surface); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-neutral { background: var(--surface-muted); color: var(--fg-muted); }
.b-accent { background: var(--accent-muted); color: var(--accent); }
.b-success { background: var(--success-muted); color: var(--success); }
.b-warning { background: var(--warning-muted); color: var(--warning); }
.b-danger { background: var(--danger-muted); color: var(--danger); }
.b-info { background: var(--info-muted); color: var(--info); }
.banner { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.banner b { font-size: 15px; }
.banner.warn { background: var(--warning-muted); color: var(--fg); border: 1px solid var(--warning); }
.banner.info { background: var(--info-muted); color: var(--fg); border: 1px solid var(--info); }
.banner.err { background: var(--danger-muted); color: var(--fg); border: 1px solid var(--danger); }
.banner.ok { background: var(--success-muted); color: var(--fg); border: 1px solid var(--success); }
.empty { text-align: center; padding: 28px 16px; border: 1px dashed var(--border); border-radius: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.empty b { font-size: 16px; }
.skel { background: var(--surface-muted); border-radius: 10px; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .lbl { font-weight: 600; font-size: 14px; }
.field .hint { color: var(--fg-muted); font-size: 13px; }
.field .err { color: var(--danger); font-size: 13px; font-weight: 600; }
.input { min-height: 44px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 0 12px; width: 100%; }
.input.bad { border-color: var(--danger); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 44px; border: 0; background: transparent; cursor: pointer; font-weight: 600; padding: 0 6px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.list > li { padding: 10px 0; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.list > li:first-child { border-top: 0; padding-top: 2px; }
.me { font-weight: 700; }
.me::after { content: " (you)"; font-weight: 400; color: var(--fg-muted); font-size: 13px; }
a.lnk { color: var(--accent); font-weight: 600; text-decoration: none; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
.switch { width: 50px; height: 30px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-muted); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg-muted); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { left: 23px; background: var(--accent-fg); }

/* score table */
.scoretbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.scoretbl td { padding: 8px 4px; border-top: 1px solid var(--border); }
.scoretbl tr:first-child td { border-top: 0; }
.scoretbl td.n { width: 100%; }
.scoretbl td.s { text-align: center; min-width: 30px; font-family: var(--font-mono); font-size: 17px; }
.scoretbl td.s sup { font-size: 10px; color: var(--fg-muted); }
.scoretbl tr.win td { font-weight: 700; }
.scoretbl tr.win td.n::after { content: "✓"; color: var(--success); margin-left: 6px; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 2px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.timeline li { position: relative; }
.timeline li::before { content: ""; position: absolute; left: -20px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.diff { font-family: var(--font-mono); font-size: 13px; }
.diff del { color: var(--danger); }
.diff ins { color: var(--success); text-decoration: none; font-weight: 600; }

/* steppers */
.stepper { display: grid; grid-template-columns: 48px 44px 48px; align-items: center; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); overflow: hidden; }
.stepper button { height: 48px; border: 0; background: var(--surface-muted); font-size: 22px; font-weight: 600; cursor: pointer; }
.stepper button:disabled { opacity: .35; cursor: not-allowed; }
.stepper output { text-align: center; font-family: var(--font-mono); font-size: 22px; font-weight: 600; }
.stepper.big { grid-template-columns: 64px 64px 64px; }
.stepper.big button { height: 64px; font-size: 28px; }
.stepper.big output { font-size: 34px; }
.setcard { border: 1px solid var(--border); border-radius: 16px; background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.setcard.ok { border-color: var(--success); }
.setcard.bad { border-color: var(--danger); }
.setcard.off { opacity: .5; }
.setcard header { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 600; }
.side { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.side span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tb { border-top: 1px dashed var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.msg { font-size: 13px; font-weight: 600; }
.msg.bad { color: var(--danger); }
.msg.ok { color: var(--success); }
.msg.hint { color: var(--fg-muted); font-weight: 500; }
.pickgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pick { min-height: 48px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); font-family: var(--font-mono); font-size: 16px; font-weight: 600; cursor: pointer; }
.pick[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.whowon { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.whowon button { min-height: 56px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; cursor: pointer; padding: 6px; }
.whowon button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots i { width: 28px; height: 6px; border-radius: 3px; background: var(--surface-muted); }
.dots i.on { background: var(--accent); }
.sticky-foot { position: sticky; bottom: -24px; margin: 0 -16px -24px; padding: 12px 16px 16px; background: var(--bg); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.summary { font-family: var(--font-mono); font-size: 14px; }

/* ladder */
.div { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: stretch; }
.div .rung { border-radius: 10px; background: var(--surface-muted); display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: var(--font-mono); }
.div .body { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: inherit; }
.div.mine .body { border-color: var(--accent); box-shadow: inset 4px 0 0 var(--accent); }
.mv { font-size: 12px; font-weight: 700; }
.up { color: var(--success); } .down { color: var(--danger); } .stay { color: var(--fg-muted); }

/* sheet */
.sheet-wrap { position: absolute; inset: 0; background: color-mix(in srgb, var(--fg) 40%, transparent); display: flex; align-items: flex-end; z-index: 5; }
.sheet { background: var(--surface); width: 100%; border-radius: 24px 24px 0 0; padding: 18px 16px 24px; display: flex; flex-direction: column; gap: 12px; max-height: 85%; overflow-y: auto; }
.sheet header { display: flex; justify-content: space-between; align-items: center; }
.sheet h2 { margin: 0; font-size: 18px; }
.ann { font-size: 12px; color: var(--info); border: 1px dashed var(--info); border-radius: 8px; padding: 4px 8px; }
</style>
</head>
<body>
<div class="bench">
  <aside class="rail" aria-label="Wireframe controls">
    <div>
      <h1>Social Tennis · Phase 1 wireframes</h1>
      <p class="small">Issue #41. Every screen in <code>docs/phase-1-score-collection.md</code>. Pick a screen, then a state. Everything inside the phone is clickable and fake.</p>
    </div>
    <div id="states"></div>
    <div id="extras"></div>
    <nav id="screens" aria-label="Screens"></nav>
    <div>
      <h2>Theme</h2>
      <div class="chips" id="theme"></div>
    </div>
  </aside>
  <div class="phone"><div class="screen" id="screen" aria-live="polite"></div></div>
  <aside class="notes" id="notes" aria-label="Design notes"></aside>
</div>

<script>
"use strict";
/* ---------------------------------------------------------------- data */
const ME = "Ben Carter";
const KIDS = ["Alex Carter", "Mia Carter"];
const SINGLES = { id: "singles", name: "Men's Singles Ladder", type: "Singles · men", format: { games: 6, bestOf: 3, matchTb: true }, formatText: "Best of 3 sets of 6 · match tiebreak decider", month: "November", deadline: "30 Nov", close: "Manager closes" };
const FOURS = { id: "fours", name: "Thursday Foursomes", type: "Foursomes", format: { games: 9, bestOf: 1, matchTb: false }, formatText: "One set of 9", month: "November", deadline: "30 Nov", close: "Closes automatically" };
const LADDER = [
  { d: 1, a: "Tom Reid", b: "Omar Ali", score: "6–4 6–2", status: "played", win: "a" },
  { d: 2, a: "Josh Lee", b: "Ravi Rao", status: "pending" },
  { d: 3, a: ME, b: "Dev Shah", status: "pending", mine: true },
  { d: 4, a: "Liam Moss", b: "Nate Cole", score: "6–2 2–1 ret.", status: "retirement", win: "a" },
];
const BYE = "Gus Ward";

/* ---------------------------------------------------------------- screens */
const SCREENS = [
  { id: "login", n: "P1", title: "Log in", group: "Player", states: ["default", "sent", "bad-link"] },
  { id: "home", n: "P2", title: "Home", group: "Player", states: ["default", "held-up", "bye", "empty", "loading", "error"] },
  { id: "match", n: "P3", title: "Match", group: "Player", states: ["score-needed", "scored", "locked", "walkover", "loading", "error"] },
  { id: "score", n: "P4", title: "Score entry", group: "Player", states: ["new", "edit", "server-error"] },
  { id: "ladder", n: "P5", title: "League ladder", group: "Player", states: ["default", "foursomes", "held-up", "past-month", "not-started", "loading", "error"] },
  { id: "leagues", n: "P6", title: "Leagues", group: "Player", states: ["default", "empty", "loading", "error"] },
  { id: "profiles", n: "P7", title: "My profiles", group: "Player", states: ["parent", "single"] },
  { id: "manage", n: "M1", title: "Manage", group: "Manager", states: ["default", "empty"] },
  { id: "setup", n: "M2", title: "League setup", group: "Manager", states: ["new", "invalid"] },
  { id: "players", n: "M3", title: "Players", group: "Manager", states: ["default", "add-player", "empty"] },
  { id: "start", n: "M4", title: "Start the league", group: "Manager", states: ["singles", "foursomes"] },
  { id: "todo", n: "M5", title: "To-do", group: "Manager", states: ["default", "walkover", "empty", "loading", "error"] },
  { id: "close", n: "M6", title: "Close the month", group: "Manager", states: ["ready", "held-up", "closed"] },
  { id: "admin", n: "A1", title: "Club and roles", group: "Admin", states: ["default", "no-club", "error"] },
];

const NOTES = {
  login: { what: "One email field. The link is the password.", decisions: ["After sending, the same screen confirms where the link went, so a typo is obvious.", "An expired or reused link lands back here with a plain explanation and the form ready."], questions: ["Should the confirmation say how long the link lasts (e.g. 15 minutes)?"] },

/* ---------------------------------------------------------------- score rules (mirror of #38's server validation) */
function fmt() { return SCENARIOS[S.scenario]; }
/** Number of set slots the entry shows right now, given the format and what's entered. */
function visibleSets(f, sets) {
  if (f.bestOf === 1) return 1;
  const w = [0, 1].map((i) => setResult(f, sets[i], false).winner);
  return w[0] && w[1] && w[0] !== w[1] ? 3 : 2;
}
/** {state: ok|bad|empty|partial, winner: a|b|null, msg} for one set. */
function setResult(f, s, isMatchTb) {
  const N = f.games;
  if (isMatchTb) {
    const hi = Math.max(s.a, s.b), lo = Math.min(s.a, s.b);
    if (hi === 0 && lo === 0) return { state: "empty", winner: null, msg: "First to 10 points, 2 clear." };
    if (hi < 10) return { state: "partial", winner: null, msg: "A match tiebreak is first to 10." };
    if (hi - lo < 2) return { state: "bad", winner: null, msg: "Needs a 2-point lead (e.g. 10–8, 11–9)." };
    if (hi > 10 && hi - lo !== 2) return { state: "bad", winner: null, msg: "Past 10, it ends as soon as someone is 2 clear." };
    return { state: "ok", winner: s.a > s.b ? "a" : "b", msg: "" };
  }
  if (s.a === 0 && s.b === 0) return { state: "empty", winner: null, msg: "" };
  if (s.a === N - 1 && s.b === N - 1) {
    const hi = Math.max(s.ta, s.tb), lo = Math.min(s.ta, s.tb);
    if (hi === 0 && lo === 0) return { state: "partial", winner: null, msg: `At ${N - 1}–${N - 1} it's a tiebreak. Enter the points.` };
    if (hi < 7) return { state: "partial", winner: null, msg: "A tiebreak is first to 7." };
    if (hi - lo < 2 || (hi > 7 && hi - lo !== 2)) return { state: "bad", winner: null, msg: "The tiebreak needs a 2-point lead (7–5, 8–6, …)." };
    return { state: "ok", winner: s.ta > s.tb ? "a" : "b", msg: "", tb: true };
  }
  const hi = Math.max(s.a, s.b), lo = Math.min(s.a, s.b);
  if (hi === N && lo <= N - 2) return { state: "ok", winner: s.a > s.b ? "a" : "b", msg: "" };
  if (hi === N && lo === N - 1) return { state: "bad", winner: null, msg: `${N}–${N - 1} can't happen: at ${N - 1}–${N - 1} the set goes to a tiebreak.` };
  return { state: "partial", winner: null, msg: `A set ends at ${N} games, or by tiebreak at ${N - 1}–${N - 1}.` };
}
function setLabel(f, s, r, isMatchTb) {
  if (isMatchTb) return `[${s.a}–${s.b}]`;
  if (r.tb) { const aw = r.winner === "a"; return `${aw ? f.games : f.games - 1}–${aw ? f.games - 1 : f.games}(${Math.min(s.ta, s.tb)})`; }
  return `${s.a}–${s.b}`;
}
/** Whole-Game verdict: can it be saved, and what would it say. */
function evaluate() {
  const f = fmt(), sc = S.score, n = visibleSets(f, sc.sets);
  const res = sc.sets.slice(0, n).map((s, i) => setResult(f, s, f.matchTb && i === 2));
  const wins = { a: 0, b: 0 }; res.forEach((r) => r.winner && wins[r.winner]++);
  const need = f.bestOf === 1 ? 1 : 2;
  const labels = sc.sets.slice(0, n).map((s, i) => res[i].state === "empty" ? null : setLabel(f, s, res[i], f.matchTb && i === 2)).filter(Boolean);
  const bad = res.find((r) => r.state === "bad");
  if (sc.ret) {
    if (!sc.retWinner) return { ok: false, msg: "Pick who won the retired Game.", labels };
    if (bad) return { ok: false, msg: bad.msg, labels };
    return { ok: true, winner: sc.retWinner, labels: [...labels, "ret."], msg: "" };
  }
  if (bad) return { ok: false, msg: bad.msg, labels };
  if (wins.a >= need || wins.b >= need) {
    const incomplete = res.find((r) => r.state === "partial");
    if (incomplete) return { ok: false, msg: incomplete.msg, labels };
    return { ok: true, winner: wins.a >= need ? "a" : "b", labels, msg: "" };
  }
  const firstOpen = res.findIndex((r) => r.state !== "ok");
  return { ok: false, msg: firstOpen >= 0 ? `Set ${firstOpen + 1}: ${res[firstOpen].msg || "enter the games."}` : "Enter the sets.", labels };
}

function retirementBlock() {

function footer() {

function dateField() {

/* Variant A: every set on one screen as stepper rows. */
function variantA(f) {
  const n = visibleSets(f, S.score.sets);
  let sets = ""; for (let i = 0; i < n; i++) sets += setBlock(i, f);
  if (f.bestOf === 3 && n === 2) sets += `<div class="setcard off"><header>${f.matchTb ? "Match tiebreak" : "Set 3"} ${badge("neutral", "Only at one set all")}</header></div>`;
  return `${dateField()}${sets}${retirementBlock()}${footer()}`;
}
/* Variant B: per set, tap who won, then tap the loser's games. */
function variantB(f) {
  const sc = S.score, n = visibleSets(f, sc.sets), [na, nb] = names(), N = f.games;
  let out = dateField();
  for (let i = 0; i < n; i++) {
    const mtb = f.matchTb && i === 2, s = sc.sets[i], w = sc.pickWinner[i];
    const title = mtb ? "Match tiebreak" : f.bestOf === 1 ? "Set" : `Set ${i + 1}`;
    if (mtb) { out += setBlock(i, f); continue; }
    const chips = w ? Array.from({ length: N }, (_, g) => g).map((g) => {
      const tb = g === N - 1, label = tb ? `${N}–${N - 1} TB` : `${N}–${g}`;
      const on = tb ? s.a === N - 1 && s.b === N - 1 : (w === "a" ? s.a === N && s.b === g : s.b === N && s.a === g);
      return `<button class="pick" aria-pressed="${on}" data-act="chip" data-i="${i}" data-g="${g}">${label}</button>`;
    }).join("") : "";
    const r = setResult(f, s, false);
    const tbRow = s.a === N - 1 && s.b === N - 1 ? `<div class="tb"><div class="lbl">Tiebreak points</div><div class="side"><span>${na}</span>${stepper(`${i}.ta`, s.ta, 30)}</div><div class="side"><span>${nb}</span>${stepper(`${i}.tb`, s.tb, 30)}</div>${r.msg ? `<div class="msg ${r.state === "bad" ? "bad" : "hint"}">${r.msg}</div>` : ""}</div>` : "";
    out += `<section class="setcard ${r.state === "ok" ? "ok" : ""}"><header>${title}${r.state === "ok" ? badge("success", setLabel(f, s, r, false)) : ""}</header><div class="lbl">Who won the set?</div><div class="whowon"><button aria-pressed="${w === "a"}" data-act="pickw" data-i="${i}" data-v="a">${na}</button><button aria-pressed="${w === "b"}" data-act="pickw" data-i="${i}" data-v="b">${nb}</button></div>${w ? `<div class="lbl">Score</div><div class="pickgrid">${chips}</div>` : ""}${tbRow}</section>`;
  }
  if (f.bestOf === 3 && n === 2) out += `<div class="setcard off"><header>${f.matchTb ? "Match tiebreak" : "Set 3"} ${badge("neutral", "Only at one set all")}</header></div>`;
  out += `<p class="small muted" style="margin:0">Unusual score in a retirement? Switch to the steppers: <button class="btn ghost small" data-variant="A">use steppers</button></p>`;
  return out + retirementBlock() + footer();
}
/* Variant C: one set per step with large steppers, then a review step. */
function variantC(f) {
  const sc = S.score, n = visibleSets(f, sc.sets), total = f.bestOf === 1 ? 1 : 3;
  const steps = n + 1; // sets + review
  sc.step = Math.min(sc.step, steps - 1);
  const dots = `<div class="dots" aria-hidden="true">${Array.from({ length: steps }, (_, i) => `<i class="${i <= sc.step ? "on" : ""}"></i>`).join("")}</div>`;
  if (sc.step < n) {
    const i = sc.step, r = setResult(f, sc.sets[i], f.matchTb && i === 2);
    const label = f.matchTb && i === 2 ? "Match tiebreak" : f.bestOf === 1 ? "The set" : `Set ${i + 1} of up to ${total}`;
    return `${dots}<p class="muted small" style="margin:0;text-align:center">${label}</p>${setBlock(i, f, { big: true })}<div class="btns">${i > 0 ? `<button class="btn secondary" data-act="stepc" data-d="-1">Back</button>` : ""}<button class="btn primary" style="flex:1" data-act="stepc" data-d="1" ${r.state === "ok" || sc.ret ? "" : "disabled"}>${i === n - 1 ? "Review" : "Next set"}</button></div>${retirementBlock()}`;
  }
  return `${dots}<p class="muted small" style="margin:0;text-align:center">Check and save</p>${dateField()}<div class="card"><h2>Summary</h2><p class="summary" style="margin:0">${evaluate().labels.join(" ")}</p></div><button class="btn secondary" data-act="stepc" data-d="-1">Back</button>${footer()}`;
}

  return { inn, divs, rest, size };
}

  const rows = order.map((p, i) => {
    const di = p.out ? null : Math.floor(inn.indexOf(p) / (kind === "fours" ? 4 : 2)) + 1;
    const divLabel = p.out ? badge("neutral", "Left out") : di <= divs.length ? badge("accent", `Div ${di}`) : badge("info", "Bye");
    return `<li style="${p.out ? "opacity:.55" : ""}"><div style="min-width:0;flex:1"><div><b>${p.name}</b></div><div class="small muted">Rating ${p.r}${divLabel ? " · " : ""}${divLabel}</div></div><div class="btns" style="flex-wrap:nowrap;gap:4px"><button class="btn secondary small" aria-label="Move ${p.name} up" data-act="mv" data-i="${i}" data-d="-1" ${i === 0 ? "disabled" : ""}>▲</button><button class="btn secondary small" aria-label="Move ${p.name} down" data-act="mv" data-i="${i}" data-d="1" ${i === order.length - 1 ? "disabled" : ""}>▼</button><button class="btn ghost small" data-act="out" data-i="${i}">${p.out ? "Put back" : "Leave out"}</button></div></li>`;
  }).join("");
  const can = kind !== "fours" || rest.length === 0;
  return shell(`<h1 class="t">Start ${kind === "fours" ? FOURS.name : "Winter Singles"}</h1><p class="sub">Proposed by Rating, then whoever joined first. Change anything, then confirm.</p>${fourBlock}${byeNote}<div class="card"><h2>Starting ladder <span class="small muted">${inn.length} in · ${divs.length} Divisions</span></h2><ul class="list">${rows}</ul></div><button class="btn primary full" data-act="confirm" ${can ? "" : "disabled"}>Confirm and start</button><p class="small muted" style="margin:0">Starting creates December's Games. The ladder order can't be changed after this, only moved by results.</p>`, { back });
};

R.todo = (st) => {
  const back = ["manage", "Manage"];
  if (st === "loading") return shell(skeleton(3), { back });
  if (st === "error") return shell(`<h1 class="t">To-do</h1>${errorState("The to-do list")}`, { back });
  if (st === "empty") return shell(`<h1 class="t">To-do</h1><div class="empty"><b>Nothing to settle</b><span class="muted small">Every Game has a result and no Division is tied. November can close.</span><button class="btn primary" data-go="close">Close November</button></div>`, { back });
  return `${shell(`<h1 class="t">To-do</h1><p class="sub">${SINGLES.name} · November ended 30 Nov</p><div class="card hl"><h2>Division 2: no Score ${statusBadge("pending")}</h2><p style="margin:0">Josh Lee v Ravi Rao</p><div class="btns"><button class="btn primary small" data-go="score">Enter the score</button><button class="btn secondary small" data-state="walkover">Not played…</button></div></div><div class="card hl"><h2>Division 3: no Score ${statusBadge("pending")}</h2><p style="margin:0">${ME} v Dev Shah</p><div class="btns"><button class="btn primary small" data-go="score">Enter the score</button><button class="btn secondary small" data-state="walkover">Not played…</button></div></div><div class="card hl"><h2>${FOURS.name} · Division 2: tie ${badge("warning", "Tie")}</h2><p style="margin:0" class="small">Anna Price and Ed Fox both banked 15 games and split head-to-head. Who finishes higher?</p><div class="whowon"><button aria-pressed="false">Anna Price</button><button aria-pressed="false">Ed Fox</button></div></div><button class="btn secondary full" disabled>Close November (3 left)</button>`, { back })}`.replace(/<\/div><nav/, `</div>${st === "walkover" ? sheetHtml("walkover") : ""}<nav`);
};
function sheetHtml(k) { const prev = S.sheet; S.sheet = k; const h = sheet(); S.sheet = prev; return h; }

R.close = (st) => {
  const back = ["manage", "Manage"];
  if (st === "closed") return shell(`<h1 class="t">November closed</h1><div class="banner ok"><b>December is open</b><span class="small">4 new Games. Players see their new opponent on Home. Josh Lee and ${ME} moved up; Ravi Rao and Dev Shah moved down.</span></div><button class="btn secondary" data-go="ladder">See the new ladder</button>`, { back });
  if (st === "held-up") return shell(`<h1 class="t">Close November</h1><div class="banner warn"><b>Can't close yet: 3 things to settle</b><span class="small">Division 2 and Division 3 have no Score. Thursday Foursomes Division 2 is tied.</span><a class="lnk small" href="#todo" data-go="todo">Settle them in To-do ›</a></div><button class="btn primary full" disabled>Close November</button>`, { back });
  const moves = [["1", "Tom Reid", "stays (top)", "Omar Ali", "▼ to Div 2"], ["2", "Josh Lee", "▲ to Div 1", "Ravi Rao", "▼ to Div 3 (walkover)"], ["3", ME, "▲ to Div 2", "Dev Shah", "▼ to Div 4"], ["4", "Liam Moss", "▲ to Div 3", "Nate Cole", "stays (bottom)"]];
  return shell(`<h1 class="t">Close November</h1><p class="sub">${SINGLES.name} · everything is settled</p><div class="card"><h2>Who moves</h2><ul class="list">${moves.map(([d, w, wm, l, lm]) => `<li><div style="flex:1"><div class="small muted">Division ${d}</div><div class="row"><span>${w}</span><span class="mv ${wm.startsWith("▲") ? "up" : "stay"}">${wm}</span></div><div class="row"><span>${l}</span><span class="mv ${lm.startsWith("▼") ? "down" : "stay"}">${lm}</span></div></div></li>`).join("")}<li><div class="row" style="flex:1"><span>Gus Ward</span><span class="mv stay">Bye, stays</span></div></li></ul></div><button class="btn primary full" data-state="closed">Close November and open December</button><p class="small muted" style="margin:0">After closing, Players can't edit November's Scores. You can still override one.</p>`, { back });
};

R.admin = (st) => {
  if (st === "error") return shell(`<h1 class="t">Club and roles</h1>${errorState("Club settings")}`);
  if (st === "no-club") return shell(`<h1 class="t">Set up your club</h1><p class="sub">You're the first Admin. Create the club, then give Managers their role.</p><div class="field"><label for="cn">Club name</label><input class="input" id="cn" placeholder="e.g. Riverside Tennis Club"></div><button class="btn primary full" data-state="default">Create club</button>`);
  const admins = S.roles.filter((r) => r.admin).length;
  return shell(`<h1 class="t">Club and roles</h1><div class="card"><h2>Riverside Tennis Club</h2><span class="small muted">3 Leagues · 41 Players</span></div><div class="card"><h2>People and roles</h2><ul class="list">${S.roles.map((r, i) => `<li><div style="min-width:0;flex:1"><b>${r.name}</b>${r.you ? ' <span class="small muted">(you)</span>' : ""}<div class="small muted">${r.email}</div></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><label class="small" style="display:flex;gap:6px;align-items:center">Manager <button class="switch" role="switch" aria-checked="${r.manager}" aria-label="${r.name} is a Manager" data-act="role" data-i="${i}" data-k="manager"></button></label><label class="small" style="display:flex;gap:6px;align-items:center">Admin <button class="switch" role="switch" aria-checked="${r.admin}" aria-label="${r.name} is an Admin" data-act="role" data-i="${i}" data-k="admin" ${r.admin && admins === 1 ? "disabled title=\"The last Admin can't be removed\"" : ""}></button></label></div></li>`).join("")}</ul>${admins === 1 ? '<p class="small muted" style="margin:0">You\'re the only Admin, so your Admin role can\'t be removed.</p>' : ""}</div><div class="field"><label for="ge">Give someone a role</label><input class="input" id="ge" placeholder="Their email"><span class="hint">They need to have logged in once.</span></div>`);
};

/* ---------------------------------------------------------------- controls */
const PERSONA_FOR = { Player: "player", Manager: "manager", Admin: "admin" };
function renderControls() {
  const groups = ["Player", "Manager", "Admin"];
  document.getElementById("screens").innerHTML = groups.map((g) => `<div><h2>${g} screens</h2><div class="screens">${SCREENS.filter((s) => s.group === g).map((s) => `<a href="#${s.id}" aria-current="${s.id === S.screen}"><span>${s.title}</span><span class="num">${s.n}</span></a>`).join("")}</div></div>`).join("");
  const sc = SCREENS.find((s) => s.id === S.screen), cur = stateOf(S.screen);
  document.getElementById("states").innerHTML = `<h2>State</h2><div class="chips">${sc.states.map((st) => `<button class="chip" aria-pressed="${st === cur}" data-state="${st}">${st}</button>`).join("")}</div><h2 style="margin-top:12px">Viewer</h2><div class="chips">${[["player", "Player"], ["parent", "Parent (3 Players)"], ["manager", "Manager"], ["admin", "Admin"]].map(([v, l]) => `<button class="chip" aria-pressed="${S.persona === v}" data-persona="${v}">${l}</button>`).join("")}</div>`;
  document.getElementById("extras").innerHTML = S.screen === "score"
    ? `<h2>Score entry variant</h2><div class="chips">${[["A", "A · All sets"], ["B", "B · Pick scoreline"], ["C", "C · Set by set"]].map(([v, l]) => `<button class="chip" aria-pressed="${S.variant === v}" data-variant="${v}">${l}</button>`).join("")}</div><h2 style="margin-top:12px">League format</h2><div class="chips">${Object.entries(SCENARIOS).map(([k, v]) => `<button class="chip" aria-pressed="${S.scenario === k}" data-scenario="${k}">${v.label}</button>`).join("")}</div><h2 style="margin-top:12px">Try a case</h2><div class="chips">${[["straight", "6–3 6–4"], ["mtb", "Match tiebreak"], ["tb", "5–5 tiebreak"], ["ret", "Retirement"], ["bad", "Invalid 6–5"], ["clear", "Clear"]].map(([k, l]) => `<button class="chip" data-case="${k}">${l}</button>`).join("")}</div>`
    : "";
  const n = NOTES[S.screen];
  document.getElementById("notes").innerHTML = `<h2>${sc.n} · ${sc.title}</h2><p style="margin:0">${n.what}</p>${n.decisions.length ? `<h3>Decisions</h3><ul>${n.decisions.map((d) => `<li>${d}</li>`).join("")}</ul>` : ""}${n.questions.length ? `<h3>For the walkthrough</h3><ul class="q">${n.questions.map((d) => `<li>${d}</li>`).join("")}</ul>` : ""}`;
  document.getElementById("theme").innerHTML = [["system", "System"], ["light", "Light"], ["dark", "Dark"]].map(([v, l]) => `<button class="chip" aria-pressed="${S.theme === v}" data-theme-set="${v}">${l}</button>`).join("");
}
function render() {
  const el = document.getElementById("screen");
  const scrollTop = document.getElementById("scroll")?.scrollTop ?? 0;
  el.innerHTML = R[S.screen](stateOf(S.screen));
  if (S.keepScroll) { const sc = document.getElementById("scroll"); if (sc) sc.scrollTop = scrollTop; }
  S.keepScroll = false;
  renderControls();
}

/* ---------------------------------------------------------------- routing (#screen or #screen--state) */
function fromHash() {
  const [id, st] = (location.hash.slice(1) || "home").split("--");
  if (!R[id]) return;
  S.screen = id; S.sheet = null;
  if (st) S.state[id] = st;
  if (id === "manage" || id === "setup" || id === "players" || id === "start" || id === "todo" || id === "close") { if (S.persona === "player" || S.persona === "parent") S.persona = "manager"; }
  if (id === "admin") S.persona = "admin";
  render();
}
function go(id, st) {
  if (st) S.state[id] = st; else if (id === "score") S.state.score = "new";
  if (id === "score") { S.score = freshScore(stateOf("score") === "edit"); }
  const h = `#${id}`;
  if (location.hash === h) fromHash(); else location.hash = h;
}
window.addEventListener("hashchange", fromHash);

/* ---------------------------------------------------------------- events */
document.addEventListener("click", (e) => {
  const t = e.target.closest("button, a, [data-close]");
  if (!t) return;
  const d = t.dataset;
  if (t.matches("[data-close]") && (e.target === t || t.tagName === "BUTTON")) { S.sheet = null; if (["walkover", "add-player"].includes(stateOf(S.screen))) S.state[S.screen] = "default"; render(); return; }
  if (d.go) { e.preventDefault(); go(d.go, d.st); return; }
  if (t.closest(".screens") && t.tagName === "A") return; // hash link
  if (d.state) { S.state[S.screen] = d.state; S.sheet = null; if (S.screen === "score") S.score = freshScore(d.state === "edit"); if (S.screen === "start") S.start = freshStart(d.state === "foursomes" ? "fours" : "singles"); render(); return; }
  if (d.persona) { S.persona = d.persona; if (d.persona !== "parent") S.acting = ME; render(); return; }
  if (d.variant) { S.variant = d.variant; S.score.step = 0; render(); return; }
  if (d.scenario) { S.scenario = d.scenario; S.score = freshScore(); render(); return; }
  if (d.themeSet) { S.theme = d.themeSet; if (S.theme === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme); renderControls(); return; }
  if (d.case) { applyCase(d.case); render(); return; }
  if (d.sheet) { S.sheet = d.sheet; render(); return; }
  if (d.step) { const [i, k] = d.step.split("."); const s = S.score.sets[+i]; s[k] = Math.max(0, s[k] + +d.d); S.keepScroll = true; render(); return; }
  switch (d.act) {
    case "as": S.acting = d.v; S.sheet = null; render(); break;
    case "ret": S.score.ret = !S.score.ret; S.score.retWinner = null; S.keepScroll = true; render(); break;
    case "retw": S.score.retWinner = d.v; S.keepScroll = true; render(); break;
    case "pickw": { const i = +d.i; S.score.pickWinner[i] = d.v; Object.assign(S.score.sets[i], { a: 0, b: 0, ta: 0, tb: 0 }); S.keepScroll = true; render(); break; }
    case "chip": { const i = +d.i, g = +d.g, N = fmt().games, w = S.score.pickWinner[i], s = S.score.sets[i]; if (g === N - 1) Object.assign(s, { a: N - 1, b: N - 1, ta: w === "a" ? 7 : 0, tb: w === "b" ? 7 : 0 }); else Object.assign(s, w === "a" ? { a: N, b: g } : { a: g, b: N }, { ta: 0, tb: 0 }); S.keepScroll = true; render(); break; }
    case "stepc": S.score.step = Math.max(0, S.score.step + +d.d); render(); break;
    case "save": S.state.match = "scored"; go("match"); break;
    case "mv": { const o = S.start.order, i = +d.i, j = i + +d.d; [o[i], o[j]] = [o[j], o[i]]; S.keepScroll = true; render(); break; }
    case "out": S.start.order[+d.i].out = !S.start.order[+d.i].out; S.keepScroll = true; render(); break;
    case "confirm": S.start.confirmed = true; render(); break;
    case "setup": S.setup[d.k] = isNaN(+d.v) ? d.v : +d.v; render(); break;
    case "setup-mtb": S.setup.matchTb = !S.setup.matchTb; render(); break;
    case "setup-auto": S.setup.auto = !S.setup.auto; render(); break;
    case "role": { const r = S.roles[+d.i]; r[d.k] = !r[d.k]; render(); break; }
  }
});
document.addEventListener("change", (e) => {
  if (e.target.matches('[data-act="month"]')) { S.state.ladder = e.target.selectedIndex === 0 ? "default" : "past-month"; render(); }
  if (e.target.matches('[data-act="setup-type"]')) { S.setup.type = e.target.value; render(); }
});
function applyCase(k) {
  const N = fmt().games;
  S.score = freshScore(); const s = S.score.sets;
  if (k === "straight") { Object.assign(s[0], { a: N, b: N - 3 }); if (fmt().bestOf === 3) Object.assign(s[1], { a: N, b: N - 2 }); }
  if (k === "mtb") { if (S.scenario !== "bo3-mtb") S.scenario = "bo3-mtb"; Object.assign(s[0], { a: 6, b: 4 }); Object.assign(s[1], { a: 3, b: 6 }); Object.assign(s[2], { a: 10, b: 7 }); }
  if (k === "tb") { Object.assign(s[0], { a: N - 1, b: N - 1, ta: 7, tb: 5 }); }
  if (k === "ret") { Object.assign(s[0], { a: N, b: 2 }); Object.assign(s[1], { a: 2, b: 1 }); S.score.ret = true; S.score.retWinner = "a"; }
  if (k === "bad") { Object.assign(s[0], { a: N, b: N - 1 }); }
  S.score.pickWinner = s.map((x) => (x.a > x.b ? "a" : x.b > x.a ? "b" : x.ta > x.tb ? "a" : x.tb > x.ta ? "b" : null));
  S.score.step = 0;
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
});

fromHash();
</script>
</body>
</html>
