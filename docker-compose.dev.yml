# Dev overlay: source bind-mounted, hot reload, no image rebuild needed.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    build: !reset null
    working_dir: /src
    volumes:
      - ./api:/src
      - nuget:/root/.nuget/packages
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=tennis;Username=tennis;Password=tennis"
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      # As api-tests: build output apart from the language server's (#121).
      SOCIAL_TENNIS_CONTAINER_BUILD: "true"
    command: dotnet watch --project src/SocialTennis.Api run --urls http://0.0.0.0:8080
    # The base file's probe runs the published DLL, which `dotnet watch` has no
    # copy of here. The SDK image has a shell, so speak HTTP over bash's /dev/tcp.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n1 <&3 | grep -q ' 200 '

  web:
    image: node:24-alpine
    build: !reset null
    working_dir: /src
    volumes:
      - ./web:/src
      - web_node_modules:/src/node_modules
    environment:
      # Web alone, against the mock API (ADR-0033):
      #   API_URL=http://mock-api:8080 docker compose -f docker-compose.yml -f docker-compose.dev.yml up --no-deps web mock-api
      API_URL: ${API_URL:-http://api:8080}
      PUBLIC_BASE_URL: http://localhost:3000
      WATCHPACK_POLLING: "true"
    # `npm ci`: installs exactly what package-lock.json says, never updates it (#113).
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0"

volumes:
  web_node_modules:
