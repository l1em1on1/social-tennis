# Release pipeline for the PoC hosting (ADR-0019, issue #27).
#
#   push to main that  → publish: build both images, push to GHCR tagged with
#   changes web/ or api/  the commit SHA. Nothing is deployed. A merge that
#                        touches neither builds nothing: the newest images
#                        already hold that code.
#   "Run workflow"     → plan:  show what Terraform would change (main only).
#                        apply: wait for approval, then apply it and check
#                               the site answers.
#
# Deploying is always a person's decision: run the workflow, read the plan,
# approve. By default it deploys the newest published images: the first commit,
# walking back from the one the run is on, that has images. Rolling back is the
# same run with an earlier published SHA.
#
# Azure access is OIDC: a short-lived token per run, trusted by Azure only for
# the `production-plan` and `production` environments of this repo
# (scripts/setup-hosting.sh creates both). No cloud key is stored in GitHub.
#
# Before applying, the apply job backs the database up (#137) by starting the
# backup job and waiting for it; a failed backup stops the deploy. The
# skip_backup input skips it. On the first deploy the job doesn't exist yet,
# and the step says so and goes on.
#
# The plan is printed to the log, never uploaded: a saved plan file contains
# the database password and the mail connection string, and artifacts of a
# public repo can be downloaded.
name: deploy

on:
  push:
    branches: [main]
    # Only the publish job runs on push, and it only has work when the images'
    # contents change. This is not a pull-request check, so a path filter
    # can't leave a required check pending.
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (full, 40 characters). Empty: the newest published images."
        required: false
        type: string
      always_on:
        description: "Keep one replica of each app running (no cold starts; leaves the free grant)"
        required: false
        type: boolean
        default: false
      long_cooldown:
        description: "Keep the apps running 30 minutes after the last request, not 5 (fewer cold starts; spends the free grant faster)"
        required: false
        type: boolean
        default: false
      skip_backup:
        description: "Skip the database backup that runs before applying (e.g. a web-only change, or while the backup job can't write yet)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: publish images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Sign in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push web and api, tagged with this commit
        run: |
          for service in web api; do
            image="${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
            docker build --tag "$image" "./${service}"
            docker push "$image"
          done

  plan:
    name: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-plan
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
      web_digest: ${{ steps.image.outputs.web_digest }}
      api_digest: ${{ steps.image.outputs.api_digest }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS }}
      TF_VAR_always_on: ${{ inputs.always_on }}
      TF_VAR_long_cooldown: ${{ inputs.long_cooldown }}
      # The club's domain (ADR-0020, ADR-0021). Unset until
      # scripts/setup-domain.sh has run: no domain means the app answers only
      # at Azure's address and the API logs sign-in links.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_email_domain: ${{ vars.EMAIL_DOMAIN }}
      TF_VAR_email_domain_verified: ${{ vars.EMAIL_DOMAIN_VERIFIED || 'false' }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_app_domain_ready: ${{ vars.APP_DOMAIN_READY || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Enough history to walk back to the newest published images.
          fetch-depth: 100
      - name: Choose the images to deploy
        id: image
        env:
          REQUESTED: ${{ inputs.image_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          published() {
            docker manifest inspect "${IMAGE_PREFIX}-web:$1" >/dev/null 2>&1 &&
              docker manifest inspect "${IMAGE_PREFIX}-api:$1" >/dev/null 2>&1
          }
          if [ -n "$REQUESTED" ]; then
            published "$REQUESTED" || { echo "::error::No web and api images tagged ${REQUESTED}."; exit 1; }
            tag="$REQUESTED"
          else
            # Images are only built for commits that change web/ or api/, so
            # the commit this run is on may have none. The newest ancestor
            # that does holds the same code.
            tag=""
            for sha in $(git rev-list -n 100 HEAD); do
              if published "$sha"; then tag="$sha"; break; fi
            done
            [ -n "$tag" ] || { echo "::error::No published images in the last 100 commits."; exit 1; }
          fi
          # Only code that reached main is deployed: an image built from any
          # other commit is refused, even if it was published (#111).
          # "ahead" or "identical": main contains the commit.
          status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag}...main" --jq .status 2>/dev/null)" || status=""
          case "$status" in
            ahead|identical) ;;
            *) echo "::error::${tag} is not a commit on main (compare: ${status:-not found})."; exit 1 ;;
          esac

          # The digests, not the tag, go to Terraform: plan and apply then run
          # exactly these images, whatever happens to the tag in between.
          digest() {
            docker buildx imagetools inspect "${IMAGE_PREFIX}-$1:${tag}" --format '{{.Manifest.Digest}}'
          }
          web_digest="$(digest web)"
          api_digest="$(digest api)"
          for d in "$web_digest" "$api_digest"; do
            echo "$d" | grep -qE '^sha256:[0-9a-f]{64}$' || { echo "::error::Could not resolve the digests of the ${tag} images."; exit 1; }
          done

          echo "Deploying images tagged ${tag}: web ${web_digest}, api ${api_digest}"
          {
            echo "tag=${tag}"
            echo "web_digest=${web_digest}"
            echo "api_digest=${api_digest}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "TF_VAR_image_tag=${tag}"
            echo "TF_VAR_web_image_digest=${web_digest}"
            echo "TF_VAR_api_image_digest=${api_digest}"
          } >> "$GITHUB_ENV"
          {
            echo "Images: \`${tag}\`"
            echo "- web: \`${web_digest}\`"
            echo "- api: \`${api_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Plan
        run: >-
          docker compose -f infra/compose.yml run --rm infra sh -c
          "sh ./init.sh -input=false && terraform plan -input=false -lock-timeout=5m"

  apply:
    name: apply (needs approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    # Same settings as the plan job.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS }}
      TF_VAR_image_tag: ${{ needs.plan.outputs.image_tag }}
      TF_VAR_web_image_digest: ${{ needs.plan.outputs.web_digest }}
      TF_VAR_api_image_digest: ${{ needs.plan.outputs.api_digest }}
      TF_VAR_always_on: ${{ inputs.always_on }}
      TF_VAR_long_cooldown: ${{ inputs.long_cooldown }}
      # The club's domain (ADR-0020, ADR-0021). Unset until
      # scripts/setup-domain.sh has run: no domain means the app answers only
      # at Azure's address and the API logs sign-in links.
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_email_domain: ${{ vars.EMAIL_DOMAIN }}
      TF_VAR_email_domain_verified: ${{ vars.EMAIL_DOMAIN_VERIFIED || 'false' }}
      TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
      TF_VAR_app_domain_ready: ${{ vars.APP_DOMAIN_READY || 'false' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Sign in to Azure for the backup
        if: ${{ !inputs.skip_backup }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Back up the database first
        if: ${{ !inputs.skip_backup }}
        # Starts the backup job (infra/modules/backup) through Azure Resource
        # Manager and waits for that run. `az rest`, because `az containerapp`
        # is an extension the runner doesn't have. The resource group is
        # infra/main.tf's local.name.
        env:
          BACKUP_JOB: /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/social-tennis/providers/Microsoft.App/jobs/job-backup-database
        run: |
          base="https://management.azure.com${BACKUP_JOB}"
          api="api-version=2024-03-01"
          if ! found="$(az rest --method get --url "${base}?${api}" --output none 2>&1)"; then
            if printf '%s' "$found" | grep -q "ResourceNotFound"; then
              echo "::notice title=No backup before this deploy::The backup job doesn't exist yet; this deploy creates it."
              exit 0
            fi
            echo "::error title=Backup not started::Couldn't read the backup job: ${found}"
            exit 1
          fi
          execution="$(az rest --method post --url "${base}/start?${api}" --query name --output tsv)"
          if [ -z "$execution" ]; then
            execution="$(az rest --method get --url "${base}/executions?${api}" \
              --query "sort_by(value, &properties.startTime)[-1].name" --output tsv)"
          fi
          echo "Started backup ${execution}."
          for _ in $(seq 1 90); do
            status="$(az rest --method get --url "${base}/executions/${execution}?${api}" --query properties.status --output tsv)"
            case "$status" in
              Succeeded)
                echo "Backed up the database first (${execution})." >> "$GITHUB_STEP_SUMMARY"
                exit 0 ;;
              Failed|Stopped|Degraded)
                echo "::error title=Backup failed, nothing deployed::Backup ${execution} ended ${status}. Its logs: Container Apps, job-backup-database, Execution history. To deploy anyway, run again with skip_backup."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error title=Backup too slow, nothing deployed::Backup ${execution} hadn't finished after 15 minutes."
          exit 1
      - name: Apply
        run: >-
          docker compose -f infra/compose.yml run --rm infra sh -c
          "sh ./init.sh -input=false && terraform apply -input=false -auto-approve -lock-timeout=5m"
      - name: The site answers and reaches the API
        # /health answers 200 only when web can reach the API over the address
        # production uses (#111). The first request after a deploy is a cold
        # start of web, then the API (not the database). Allow three minutes.
        run: |
          url="$(docker compose -f infra/compose.yml run --rm -T infra terraform output -raw url | tr -d '\r')"
          echo "Checking ${url}/health"
          for attempt in $(seq 1 18); do
            if curl --silent --show-error --fail --max-time 30 --output /dev/null "${url}/health"; then
              echo "Answered on attempt ${attempt}."
              echo "Deployed ${TF_VAR_image_tag} to ${url}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url}/health did not answer 200 within three minutes."
          exit 1
