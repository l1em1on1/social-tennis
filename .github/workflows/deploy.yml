# Release pipeline for the PoC hosting (ADR-0019, issue #27).
#
#   push to main that  → publish: build both images, push to GHCR tagged with
#   changes web/ or api/  the commit SHA. Nothing is deployed. A merge that
#                        touches neither builds nothing: the newest images
#                        already hold that code.
#   "Run workflow"     → plan:  show what Terraform would change (main only).
#                        apply: wait for approval, then apply it and check
#                               the site answers.
#
# Deploying is always a person's decision: run the workflow, read the plan,
# approve. By default it deploys the newest published images: the first commit,
# walking back from the one the run is on, that has images. Rolling back is the
# same run with an earlier published SHA.
#
# Azure access is OIDC: a short-lived token per run, trusted by Azure only for
# the `production-plan` and `production` environments of this repo
# (scripts/setup-hosting.sh creates both). No cloud key is stored in GitHub.
#
# The plan is printed to the log, never uploaded: a saved plan file contains
# the database password, and artifacts of a public repo can be downloaded.
name: deploy

on:
  push:
    branches: [main]
    # Only the publish job runs on push, and it only has work when the images'
    # contents change. This is not a pull-request check, so a path filter
    # can't leave a required check pending.
    paths:
      - "web/**"
      - "api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Commit SHA to deploy (full, 40 characters). Empty: the newest published images."
        required: false
        type: string
      always_on:
        description: "Keep one replica of each app running (no cold starts; leaves the free grant)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: publish images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Sign in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push web and api, tagged with this commit
        run: |
          for service in web api; do
            image="${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
            docker build --tag "$image" "./${service}"
            docker push "$image"
          done

  plan:
    name: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-plan
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_always_on: ${{ inputs.always_on }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Enough history to walk back to the newest published images.
          fetch-depth: 100
      - name: Choose the images to deploy
        id: image
        env:
          REQUESTED: ${{ inputs.image_tag }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          published() {
            docker manifest inspect "${IMAGE_PREFIX}-web:$1" >/dev/null 2>&1 &&
              docker manifest inspect "${IMAGE_PREFIX}-api:$1" >/dev/null 2>&1
          }
          if [ -n "$REQUESTED" ]; then
            published "$REQUESTED" || { echo "::error::No web and api images tagged ${REQUESTED}."; exit 1; }
            tag="$REQUESTED"
          else
            # Images are only built for commits that change web/ or api/, so
            # the commit this run is on may have none. The newest ancestor
            # that does holds the same code.
            tag=""
            for sha in $(git rev-list -n 100 HEAD); do
              if published "$sha"; then tag="$sha"; break; fi
            done
            [ -n "$tag" ] || { echo "::error::No published images in the last 100 commits."; exit 1; }
          fi
          echo "Deploying images tagged ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "TF_VAR_image_tag=${tag}" >> "$GITHUB_ENV"
          echo "Images: \`${tag}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Plan
        run: >-
          docker compose -f infra/compose.yml run --rm infra sh -c
          "sh ./init.sh -input=false && terraform plan -input=false -lock-timeout=5m"

  apply:
    name: apply (needs approval)
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    # Same settings as the plan job.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      TFSTATE_RESOURCE_GROUP: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
      TF_VAR_image_tag: ${{ needs.plan.outputs.image_tag }}
      TF_VAR_always_on: ${{ inputs.always_on }}
    steps:
      - uses: actions/checkout@v5
      - name: Apply
        run: >-
          docker compose -f infra/compose.yml run --rm infra sh -c
          "sh ./init.sh -input=false && terraform apply -input=false -auto-approve -lock-timeout=5m"
      - name: The site answers
        # The first request after a deploy is a cold start: web, then (not
        # needed for /login) the API and the database. Allow three minutes.
        run: |
          url="$(docker compose -f infra/compose.yml run --rm -T infra terraform output -raw url | tr -d '\r')"
          echo "Checking ${url}/login"
          for attempt in $(seq 1 18); do
            if docker run --rm curlimages/curl:8.11.1 --silent --show-error --fail --max-time 30 --output /dev/null "${url}/login"; then
              echo "Answered on attempt ${attempt}."
              echo "Deployed ${TF_VAR_image_tag} to ${url}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${url}/login did not answer within three minutes."
          exit 1
