# API CI — every step runs through Docker Compose with the same images and
# invocations as local dev (CLAUDE.md: nothing runs bare on the runner).
#
# Runs on every PR and every push to main, and decides per job whether the
# change touches it (ADR-0002: the two halves of the repo are built separately).
# The drift job also watches web's package files and the generated client,
# since those are inputs/outputs of the contract.
name: api

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this workflow's jobs have anything to do. The workflow
  # itself always runs, so every check reports on every PR: a job skipped by
  # `if` counts as passed for a required check, whereas a workflow skipped by
  # a `paths` filter leaves the check pending forever.
  #
  # The other jobs run unless this one says "false". If it fails or is
  # cancelled it says nothing, so they run: a broken detector must never let a
  # required check pass by being skipped.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATTERN: '^(api/|docker-compose(\.dev)?\.yml$|web/src/lib/api/|web/package(-lock)?\.json$|\.github/workflows/api\.yml$)'
        run: |
          # No usable base (a branch's first push): run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    name: format and analyzers (dotnet format)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail on unformatted C# or a style rule violation
        run: docker compose run --rm --no-deps api-tests dotnet format --verify-no-changes

  integration-tests:
    name: integration tests (HTTP vs real Postgres)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the suite exactly as documented for local dev
        run: docker compose run --rm api-tests

  client-drift:
    name: OpenAPI client drift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the API (production image; migrates on boot)
        run: docker compose up -d --build api
      - name: Regenerate the TS client in-container
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.dev.yml
          run --rm --no-deps web sh -c
          "npm ci --no-audit --no-fund &&
           i=0; until wget -q --spider http://api:8080/openapi/v1.json;
           do i=$((i+1)); [ $i -ge 30 ] && echo 'api never came up' && exit 1; sleep 2; done &&
           npm run api:generate"
      - name: Fail if the committed client is out of date
        run: git diff --exit-code -- web/src/lib/api/schema.d.ts
