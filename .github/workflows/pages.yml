# Publishes the clickable wireframes in docs/ui/ to GitHub Pages, so the club
# can open them from a link: https://l1em1on1.github.io/social-tennis/
#
# Runs only on main, and only when the wireframes change. It reports no check
# on pull requests, so it is not something to require in the ruleset.
#
# There is no build: the wireframes are static, self-contained HTML, so the
# steps only copy files. Nothing here needs a toolchain (ADR-0005).
#
# One-time setup, repository owner only: Settings → Pages → Source:
# "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish; a newer one queues behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    name: assemble the wireframes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Assemble the site
        # Every HTML file in docs/ui/ is published under its own name, so the
        # deep links in the tickets (phase-1-wireframes.html#score--new) work
        # unchanged. The site root redirects to the Phase 1 wireframes.
        run: |
          mkdir _site
          cp docs/ui/*.html _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Hits &amp; Giggles wireframes</title>
          <meta http-equiv="refresh" content="0; url=phase-1-wireframes.html">
          <a href="phase-1-wireframes.html">Phase 1 wireframes</a>
          HTML
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  # A job of its own, as GitHub's docs ask ("Using custom workflows with GitHub
  # Pages"). As a step after the upload it looked for the artifact within half
  # a second, and sometimes GitHub didn't list it yet: "No artifacts named
  # github-pages were found". A new job takes seconds to start. If this one
  # still fails, "Re-run failed jobs" deploys the artifact already uploaded.
  deploy:
    name: publish wireframes
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
