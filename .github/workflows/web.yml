# Web CI. Four gates, all through compose so nothing runs bare on the runner
# (CLAUDE.md):
#   build — the production image (npm ci + next build inside web/Dockerfile),
#           the same path `docker compose up --build` uses, proof that it
#           holds no mock code (ADR-0033), and a scan that fails on a fixable
#           critical vulnerability (#114).
#   e2e   — Playwright: what the app does against the real stack, and each
#           screen against the mock's fixed data (ADR-0014, #234); the
#           screens' DOM snapshots go to Chromatic for visual
#           review (ADR-0015). Skipped while CHROMATIC_PROJECT_TOKEN is unset.
#
#   lint  — ESLint. `next build` stopped linting in Next.js 16, so nothing
#           else runs it.
#
#   storybook — builds and type-checks the component stories, checks each
#           one's accessibility in light and dark (#232), then sends them to
#           Chromatic's Storybook project (#46; that step is skipped while
#           CHROMATIC_STORYBOOK_PROJECT_TOKEN is unset).
#
# Runs on every PR and every push to main, and decides per job whether the
# change touches it (ADR-0002). api/** counts, because the e2e job runs the
# real API.
name: web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a PR cancels its older run. On main each push is its own
# group, so no run is cancelled or replaced while pending (a group keeps one
# pending run): each squash commit needs its own accepted Chromatic build, or
# a PR based on it would be compared against the build before it (ADR-0015).
# A run on main that fails publishes nothing (a partial set of snapshots
# mustn't be auto-accepted): re-run it until it publishes. The next merge's
# build accepts everything since the last accepted one anyway.
concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether this workflow's jobs have anything to do. The workflow
  # itself always runs, so every check reports on every PR: a job skipped by
  # `if` counts as passed for a required check, whereas a workflow skipped by
  # a `paths` filter leaves the check pending forever.
  #
  # The other jobs run unless this one says "false". If it fails or is
  # cancelled it says nothing, so they run: a broken detector must never let a
  # required check pass by being skipped.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATTERN: '^(web/|api/|docker-compose(\.dev)?\.yml$|\.github/workflows/web\.yml$|scripts/scan-image\.sh$|\.trivyignore\.yaml$)'
        run: |
          # No usable base (a branch's first push): run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (eslint)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Lint in the dev image, as documented for local dev
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.dev.yml
          run --rm --no-deps web sh -c
          "npm ci --no-audit --no-fund --loglevel=error && npm run lint"

  build:
    name: production image build (next build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the web image exactly as `docker compose up --build` does
        run: docker compose build web
      # The mock API isn't in this image's build context. "mock-session." is
      # in its handlers (SESSION_PREFIX) and "[MSW]" in MSW itself.
      - name: The production build contains no mock code
        run: |
          docker compose run --rm --no-deps web sh -c '
            test ! -e node_modules/msw && test ! -e node_modules/openapi-msw && test ! -e mock-api \
              || { echo "Mock code shipped in the production image"; exit 1; }
            ! grep -rqs -e "\[MSW\]" -e "mock-session\." -e MOCK_API .next server.js \
              || { echo "Mock code bundled into the production build"; exit 1; }'
      - name: Fail on a critical vulnerability that has a fix (.trivyignore.yaml lists accepted ones)
        run: scripts/scan-image.sh "$(docker compose config --format json | jq -r .name)-web"

  e2e:
    name: e2e (Playwright, mocked + real API)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Chromatic finds baselines through git history: full history, and on
          # a PR the head commit rather than GitHub's ephemeral merge commit
          # (Chromatic docs, "Run with caution when using the pull_request event").
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the e2e stack (web-e2e, web-mock, mock-api, api)
        run: docker compose --profile e2e build
      - name: Run Playwright in its compose service
        run: docker compose --profile e2e run --rm e2e
      - name: Publish the snapshots to Chromatic
        # Visual changes don't fail this job; Chromatic's own "UI Tests: social-tennis"
        # check on the PR holds the merge until they're accepted there.
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
          # On main, accepted automatically (ADR-0015), unless Dependabot's
          # merge: its PR had no visual review (#158), so its build waits in
          # Chromatic to be reviewed there, before anything else is merged.
          AUTO_ACCEPT: ${{ github.event_name == 'push' && github.event.head_commit.author.name != 'dependabot[bot]' }}
        run: |
          accept=()
          if [ "$AUTO_ACCEPT" = true ]; then accept=(--auto-accept-changes main); fi
          docker compose --profile e2e run --rm --no-deps chromatic \
            npx chromatic --playwright --exit-zero-on-changes "${accept[@]}"
      - name: Service logs
        if: failure()
        run: docker compose --profile e2e logs web-e2e web-mock mock-api api
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # On main, both Chromatic uploads accept their changes automatically
  # (`--auto-accept-changes main` when AUTO_ACCEPT, here and in the e2e
  # job), in CI only, so a local publish from main is never accepted
  # unreviewed; nor is a Dependabot merge, whose PR had no visual review: a squash
  # merge's commit isn't a descendant of the PR's, so the baselines accepted
  # on the PR don't carry to main otherwise (Chromatic docs, "GitHub
  # squash/rebase merge and the main branch"; ADR-0015).
  #
  # Component stories, light and dark at 360px (#46). Built, type-checked and
  # checked with axe on every web change, so a broken story, a play that throws
  # or a failing contrast fails here (#232). Published to Chromatic's
  # Storybook project, a second project beside the Playwright one (Chromatic
  # docs, "combine stories and E2E"), once CHROMATIC_STORYBOOK_PROJECT_TOKEN
  # is set; skipped until then.
  storybook:
    name: storybook (build, and publish to Chromatic)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    env:
      CHROMATIC_STORYBOOK_PROJECT_TOKEN: ${{ secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # As the e2e job: full history and the PR's head commit, for baselines.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build Storybook in its compose service
        run: docker compose --profile storybook run --rm --no-deps storybook npm run build-storybook
      - name: Type-check the stories (next build doesn't see them)
        run: >-
          docker compose --profile storybook run --rm --no-deps storybook
          sh -c "npx next typegen && npx tsc --noEmit"
      # Before the upload, so that a failure blocks the merge: the required
      # "UI Tests: social-tennis_storybook" check is then never reported.
      - name: Check every story's accessibility, in light and dark
        run: docker compose --profile storybook run --rm --no-deps storybook npm run test-storybook
      - name: Publish the stories to Chromatic
        if: env.CHROMATIC_STORYBOOK_PROJECT_TOKEN != ''
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ env.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
          # On main, accepted automatically (ADR-0015), unless Dependabot's
          # merge: its PR had no visual review (#158), so its build waits in
          # Chromatic to be reviewed there, before anything else is merged.
          AUTO_ACCEPT: ${{ github.event_name == 'push' && github.event.head_commit.author.name != 'dependabot[bot]' }}
        run: |
          accept=()
          if [ "$AUTO_ACCEPT" = true ]; then accept=(--auto-accept-changes main); fi
          docker compose --profile storybook run --rm --no-deps chromatic \
            npx chromatic --storybook-build-dir storybook-static --exit-zero-on-changes "${accept[@]}"

  # Chromatic posts its "UI Tests: <project>" checks only when a build is
  # published (or skipped), so a
  # PR that skips e2e would leave that check unreported and, once required,
  # blocked. `--skip` tells Chromatic this commit has nothing to review, and
  # it reports the check as passed (Chromatic docs, "Mandatory PR checks").
  chromatic-skip:
    name: chromatic (mark unaffected commit as skipped)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run == 'false' }}
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
      CHROMATIC_STORYBOOK_PROJECT_TOKEN: ${{ secrets.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tell Chromatic to skip this commit
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: docker compose --profile e2e run --rm --no-deps chromatic npx chromatic --skip
      - name: Tell Chromatic's Storybook project to skip this commit
        if: env.CHROMATIC_STORYBOOK_PROJECT_TOKEN != ''
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ env.CHROMATIC_STORYBOOK_PROJECT_TOKEN }}
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: docker compose --profile storybook run --rm --no-deps chromatic npx chromatic --skip

  # Dependabot PRs get no visual review (owner's decision, #158; ADR-0015).
  # They see only Dependabot's own secrets, so Chromatic never runs on them and
  # never reports its checks, which `main` requires: the PR would wait forever.
  # This reports each as passed, saying it was not run. A required check
  # accepts a status from any source. GitHub lets a Dependabot run raise its
  # read-only token with `permissions:`; this job gets statuses only.
  #
  # With two Chromatic projects linked to the repo, Chromatic names each
  # check "UI Tests: <project name>" (#190). Renaming a project in Chromatic
  # renames its check: change CHROMATIC_CHECKS and the required checks with it.
  #
  # It waits for the storybook job, and reports nothing if that failed: a story
  # that fails its accessibility check (#232) must block these PRs too.
  ui-tests-dependabot:
    name: UI Tests (not run on Dependabot PRs)
    needs: storybook
    if: >-
      ${{ !cancelled()
      && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
      && contains(fromJSON('["success", "skipped"]'), needs.storybook.result) }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Report Chromatic's checks as not run
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          CHROMATIC_CHECKS: "UI Tests: social-tennis|UI Tests: social-tennis_storybook"
        run: |
          IFS='|' read -ra checks <<<"$CHROMATIC_CHECKS"
          for context in "${checks[@]}"; do
            gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
              -f state=success -f context="$context" \
              -f description="Not run on Dependabot PRs (#158)"
          done
