# Web CI. Three gates, all through compose so nothing runs bare on the runner
# (CLAUDE.md):
#   build — the production image (npm ci + next build inside web/Dockerfile),
#           the same path `docker compose up --build` uses, and proof that
#           the MSW mocks were compiled out of it (ADR-0009).
#   e2e   — Playwright against the mocked and the real stack (ADR-0014),
#           then the mock run's DOM snapshots go to Chromatic for visual
#           review (ADR-0015). Skipped while CHROMATIC_PROJECT_TOKEN is unset.
#
#   lint  — ESLint. `next build` stopped linting in Next.js 16, so nothing
#           else runs it.
#
# Runs on every PR and every push to main, and decides per job whether the
# change touches it (ADR-0002). api/** counts, because the e2e job runs the
# real API.
name: web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether this workflow's jobs have anything to do. The workflow
  # itself always runs, so every check reports on every PR: a job skipped by
  # `if` counts as passed for a required check, whereas a workflow skipped by
  # a `paths` filter leaves the check pending forever.
  #
  # The other jobs run unless this one says "false". If it fails or is
  # cancelled it says nothing, so they run: a broken detector must never let a
  # required check pass by being skipped.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PATTERN: '^(web/|api/|docker-compose(\.dev)?\.yml$|\.github/workflows/web\.yml$)'
        run: |
          # No usable base (a branch's first push): run everything.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE...HEAD" | grep -qE "$PATTERN"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: lint (eslint)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint in the dev image, as documented for local dev
        run: >-
          docker compose -f docker-compose.yml -f docker-compose.dev.yml
          run --rm --no-deps web sh -c
          "npm ci --no-audit --no-fund --loglevel=error && npm run lint"

  build:
    name: production image build (next build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the web image exactly as `docker compose up --build` does
        run: docker compose build web
      - name: The production build contains no MSW code
        run: |
          docker compose run --rm --no-deps web sh -c '
            test ! -e node_modules/msw && test ! -e node_modules/openapi-msw \
              || { echo "MSW package shipped in the production image"; exit 1; }
            ! grep -rqs -e "\[MSW\]" -e onUnhandledFrame .next server.js \
              || { echo "MSW code bundled into the production build"; exit 1; }'

  e2e:
    name: e2e (Playwright, mocked + real API)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Chromatic finds baselines through git history: full history, and on
          # a PR the head commit rather than GitHub's ephemeral merge commit
          # (Chromatic docs, "Run with caution when using the pull_request event").
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the e2e stack (web-e2e, web-mock, api)
        run: docker compose --profile e2e build
      - name: Run Playwright in its compose service
        run: docker compose --profile e2e run --rm e2e
      - name: Publish the snapshots to Chromatic
        # Visual changes don't fail this job; Chromatic's own "UI Tests"
        # check on the PR holds the merge until they're accepted there.
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: docker compose --profile e2e run --rm --no-deps chromatic
      - name: Service logs
        if: failure()
        run: docker compose --profile e2e logs web-e2e web-mock api
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 7

  # Chromatic posts its "UI Tests" check only when a build is published, so a
  # PR that skips e2e would leave that check unreported and, once required,
  # blocked. `--skip` tells Chromatic this commit has nothing to review, and
  # it reports the check as passed (Chromatic docs, "Mandatory PR checks").
  chromatic-skip:
    name: chromatic (mark unaffected commit as skipped)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run == 'false' }}
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Tell Chromatic to skip this commit
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        env:
          CHROMATIC_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          CHROMATIC_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHROMATIC_SLUG: ${{ github.repository }}
        run: docker compose --profile e2e run --rm --no-deps chromatic npx chromatic --skip
