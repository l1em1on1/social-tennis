# Monthly update PRs, grouped so one ecosystem is one PR to review (#113).
#
# Minor and patch versions only. A major version is a migration, not a bump,
# and is taken by hand when it is wanted: Dependabot's one-PR-per-major-per-
# project stream was closed unmerged every week. `ignore` is a version-updates
# option; a vulnerability still raises a Dependabot alert (Security tab) and a
# security update, whatever its version.
#
# Versions that must move together:
#   @playwright/test (npm) and the mcr.microsoft.com/playwright image tag in
#   docker-compose.yml must be equal: the browsers ship in the image. Dependabot
#   can't put an npm package and a compose image in one PR, so the image is
#   ignored below. The npm PR's e2e job fails until the image tag is bumped on
#   that same branch by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  # The solution file covers the API and both test projects, so a package they
  # share moves in one PR.
  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  # Actions are pinned by commit SHA with the version in a comment; Dependabot
  # moves both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]

  # Base images are pinned as tag@sha256 digest (#25); Dependabot moves both.
  - package-ecosystem: docker
    directories: [/api, /web, /web/mock-api, /infra]
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      terraform-providers:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Dependabot names this image "playwright", not by its full path: the
      # full name never matched, and #142 bumped the image alone (#145).
      - dependency-name: playwright
