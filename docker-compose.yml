# Shared by the three web services. /login renders without calling the API,
# so this is web's own health only.
x-web-healthcheck: &web-healthcheck
  test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/login"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: 2s

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
      POSTGRES_DB: tennis
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./api
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=tennis;Username=tennis;Password=tennis"
      # Local only: sign in as this address to be an Admin (Manage tab, approving
      # club members). Production reads the ADMIN_EMAILS secret.
      Auth__AdminEmails: admin@example.com
      # Local only: this stack runs the API as Production, where logging
      # sign-in links must be asked for explicitly (#107). Locally that is the
      # point: the link is read from `docker compose logs api`.
      Email__AllowLogProvider: "true"
      # Local only: the E2E suite signs in from one container, so it is one
      # client to the per-client limit (#108), which allows 5 a minute.
      Auth__MagicLinkRequestsPerClientPerMinute: "1000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # GET /health/ready: up, migrated, and able to reach Postgres. The runtime
      # image is chiseled, with no shell, curl or wget (#25), so the app probes
      # itself: `healthcheck` makes one request and exits 0 or 1 (HealthProbe.cs).
      test: ["CMD", "dotnet", "SocialTennis.Api.dll", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      # Generous: under the dev overlay this covers restore + first compile.
      start_period: 180s
      start_interval: 2s

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
      PUBLIC_BASE_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *web-healthcheck

  # One-shot test runner: docker compose run --rm api-tests
  api-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    profiles: ["test"]
    working_dir: /src
    volumes:
      - ./api:/src
      - nuget:/root/.nuget/packages
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=tennis_test;Username=tennis;Password=tennis"
      # Restore and build into obj/container and bin/container, so the language
      # server's restore in obj/ survives a test run (api/Directory.Build.props, #121).
      SOCIAL_TENNIS_CONTAINER_BUILD: "true"
    depends_on:
      postgres:
        condition: service_healthy
    command: dotnet test

  # ---- Frontend E2E (ADR-0014): docker compose --profile e2e run --rm e2e ----
  # Two production builds of web, both served under their compose hostnames:
  # web-e2e talks to the real api; web-mock has the MSW mocks baked in and no
  # api at all. Neither publishes a port; only the e2e runner reaches them.
  web-e2e:
    build: ./web
    profiles: ["e2e"]
    environment:
      API_URL: http://api:8080
      PUBLIC_BASE_URL: http://web-e2e:3000
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *web-healthcheck

  web-mock:
    build:
      context: ./web
      args:
        MOCK_API: "1"
    profiles: ["e2e"]
    environment:
      # Never contacted: MSW answers every call to this origin in-process.
      API_URL: http://api:8080
      PUBLIC_BASE_URL: http://web-mock:3000
    healthcheck: *web-healthcheck

  # One-shot Playwright runner. The image tag must equal the @playwright/test
  # version in web/package.json (browsers are baked into the image).
  e2e:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e"]
    working_dir: /src
    volumes:
      - ./web:/src
      # Own volume, not web_node_modules: that one holds Alpine (musl) native
      # binaries for the dev server; this image is Ubuntu (glibc).
      - e2e_node_modules:/src/node_modules
    environment:
      CI: ${CI:-}
      # Real-API logins seed the magic-link token here (e2e/support/auth.ts).
      DATABASE_URL: postgres://tennis:tennis@postgres:5432/tennis
    depends_on:
      postgres:
        condition: service_healthy
      web-e2e:
        condition: service_healthy
      web-mock:
        condition: service_healthy
    # Install first, then run the command; `run --rm e2e <args>` replaces only
    # the command, e.g. `npx playwright test --project=mock`.
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && exec \"$$@\"", "--"]
    command: ["npx", "playwright", "test"]

  # Storybook (#46): stories for the visual components, light and dark.
  #   docker compose --profile storybook up storybook          dev server, http://localhost:6006
  #   docker compose --profile storybook run --rm storybook npm run build-storybook
  # The build lands in web/storybook-static, which `chromatic` uploads to the
  # Storybook project with that project's token:
  #   CHROMATIC_PROJECT_TOKEN=<storybook project token> docker compose --profile storybook \
  #     run --rm --no-deps chromatic npx chromatic --storybook-build-dir storybook-static --exit-zero-on-changes
  # Same image and node_modules volume as e2e and chromatic (glibc).
  storybook:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["storybook"]
    working_dir: /src
    volumes:
      - ./web:/src
      - e2e_node_modules:/src/node_modules
    ports:
      - "6006:6006"
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && exec \"$$@\"", "--"]
    command: ["npm", "run", "storybook"]

  # Visual review (ADR-0015): uploads the DOM archives the e2e run left in
  # web/test-results/chromatic-archives. Run it after `run --rm e2e`:
  #   CHROMATIC_PROJECT_TOKEN=... docker compose --profile e2e run --rm --no-deps chromatic
  # Needs the whole repo, not just web/: the CLI reads git history to link the
  # build to its commit and find baselines. Same image as e2e (it has git).
  chromatic:
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    profiles: ["e2e", "storybook"]
    working_dir: /repo/web
    volumes:
      - .:/repo
      - e2e_node_modules:/repo/web/node_modules
    environment:
      CHROMATIC_PROJECT_TOKEN: ${CHROMATIC_PROJECT_TOKEN:-}
      # Set by CI; empty locally, where the CLI reads them from git.
      CHROMATIC_BRANCH: ${CHROMATIC_BRANCH:-}
      CHROMATIC_SHA: ${CHROMATIC_SHA:-}
      CHROMATIC_SLUG: ${CHROMATIC_SLUG:-}
      # The checkout is owned by the host/runner user, not this container's
      # root; without this git refuses it as "dubious ownership".
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    entrypoint: ["sh", "-c", "npm ci --no-audit --no-fund --loglevel=error && exec \"$$@\"", "--"]
    # Changes don't fail the job: they're reviewed and accepted in Chromatic,
    # whose own "UI Tests" status check gates the PR.
    command: ["npx", "chromatic", "--playwright", "--exit-zero-on-changes"]

volumes:
  pgdata:
  nuget:
  e2e_node_modules:
