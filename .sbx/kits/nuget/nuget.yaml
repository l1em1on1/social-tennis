# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: NuGet package restore
description: "Egress to nuget.org, so dotnet restore works and csharp-ls can resolve packages"

capabilities:
  # Sandboxes deny egress by default. Without this, `dotnet restore` fails with
  # NU1301 / 403 on every package, and csharp-ls reports every NuGet type
  # (WebApplicationFactory, Fact, Assert, ...) as missing. api.nuget.org serves
  # both the service index and the flat-container package downloads.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.nuget.org

  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &context
      content: |
        # NuGet

        nuget.org is reachable, so `dotnet restore` works. If C# LSP reports NuGet
        or sibling-project types missing, run `dotnet restore api/SocialTennis.slnx`
        once in this sandbox: `obj/project.assets.json` holds absolute paths, and a
        restore made outside the sandbox leaves ones that don't exist here.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *context
