schemaVersion: "2"
kind: mixin
name: context7
displayName: Context7 Docs MCP
description: "Context7 remote MCP server, with the API key held by the sandbox proxy"

# Sandboxes deny egress by default, so the MCP endpoint has to be named
# explicitly or every tool call fails at the proxy rather than at Context7.
caps:
  network:
    allow:
      - mcp.context7.com

# The Context7 plugin sends `Authorization: ${CONTEXT7_API_KEY}`, which inside
# the sandbox is a proxy-managed sentinel, not the key. The proxy swaps in the
# real value on the way out, so the key never exists inside the container.
#
# Docker MCP Toolkit's own copy of this key (docker/mcp/context7.api_key) cannot
# be reused: `docker mcp secret` has no export and the credential helper refuses
# the read. The key is supplied to sbx separately — see README.md.
credentials:
  - service: context7
    apiKey:
      name: CONTEXT7_API_KEY
      proxyManaged: true
      inject:
        - domain: mcp.context7.com
          header: Authorization
          format: Bearer %s

commands:
  install:
    - command: "claude plugin install context7@claude-plugins-official"
      user: "1000"
      description: Register the Context7 MCP server with Claude Code

agentContext: |
  Context7 is available as an MCP server (`resolve-library-id`, `query-docs`).

  Per CLAUDE.md, query it before writing, changing, or reviewing code that
  touches a library or framework — Next.js, React, EF Core, ASP.NET Core,
  Npgsql, openapi-fetch/openapi-typescript, Tailwind, xUnit. One focused
  question per concept. Where Context7's docs and training data disagree, the
  docs win; cite the doc-backed reason in the code comment or PR description.

  The API key is injected by the sandbox proxy. `CONTEXT7_API_KEY` reads as a
  proxy-managed sentinel inside the sandbox — that is correct, not a broken
  config, and there is nothing to fix by setting it to the real key.
